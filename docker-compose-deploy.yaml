version: "3.8"

services:
  app:
    build:
      context: .
    restart: always
    volumes:
      - static-data:/vol/web
    env_file:
      - ./env/.env.dev
    environment:
      - POSTGRES_DB_HOST=db
    depends_on:
      - db

  db:
    image: postgres:18.4-alpine3.23
    restart: always
    volumes:
      - postgres-data:/var/lib/postgresql
    env_file:
      - ./env/.env.dev

  proxy:
    build:
      context: ./proxy
    restart: always
    depends_on:
      - app
    ports:
      - 8080:8000
    volumes:
      - static-data:/vol/web

volumes:
  postgres-data:
  static-data: